[project]
name = "knowledgebase"
version = "2.0.0"
description = "Production-ready RAG Knowledge Base System"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Your Name", email = "you@example.com" }
]
keywords = ["rag", "knowledge-base", "fastapi", "langgraph"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # Web Framework
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.30.0",
    # Authentication
    "pyjwt>=2.8.0",
    "bcrypt>=4.1.0",
    # Database
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.20.0",
    # AI/LLM
    "langchain>=0.1.0",
    "langchain-groq>=0.1.0",
    "langgraph>=0.1.0",
    "langchain-community>=0.0.10",
    # Embeddings & Search
    "sentence-transformers>=3.0.0",
    "faiss-cpu>=1.8.0",
    "rank-bm25>=0.2.0",
    # Web Search
    "duckduckgo-search>=5.0.0",
    # Configuration
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    # File Processing
    "pdfplumber>=0.11.0",
    "python-docx>=1.1.0",
    "pandas>=2.2.0",
    "openpyxl>=3.1.0",
    # HTTP Client
    "httpx>=0.27.0",
    "groq>=0.6.0",
    # Utilities
    "python-multipart>=0.0.9",
    "email-validator>=2.0.0",
    "numpy>=1.25.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-html>=4.2.0",
    "pytest-playwright>=0.5.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]
prod = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short --cov=src --cov-report=term-missing"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true

[project.scripts]
kb-server = "src.main:main"
kb-worker = "src.core.workers.supervisor:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]
