<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 160" width="520" height="160">
  <defs>

    <!-- Aurora gradient: diagonal blue → violet -->
    <linearGradient id="aurora" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#4F8EF7"/>
      <stop offset="55%"  stop-color="#7B5CF6"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>

    <!-- Horizontal aurora for text fill -->
    <linearGradient id="auroraH" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#5B9BFF"/>
      <stop offset="100%" stop-color="#B89BFF"/>
    </linearGradient>

    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#050A16"/>
      <stop offset="100%" stop-color="#070D1D"/>
    </linearGradient>

    <!-- Radial glow behind icon -->
    <radialGradient id="iconGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#4F8EF7" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#4F8EF7" stop-opacity="0"/>
    </radialGradient>

    <!-- Node inner fill gradient -->
    <radialGradient id="coreGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%"   stop-color="#A8D4FF"/>
      <stop offset="100%" stop-color="#7B5CF6"/>
    </radialGradient>

    <!-- Glow filter — small (satellite nodes) -->
    <filter id="glowSm" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Glow filter — medium (center node) -->
    <filter id="glowMd" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft glow for wordmark text -->
    <filter id="glowTxt" x="-8%" y="-60%" width="116%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Card clip -->
    <clipPath id="cardClip">
      <rect width="520" height="160" rx="22"/>
    </clipPath>

  </defs>

  <!-- ═══════════════════════════════════════════ -->
  <!--  CARD BACKGROUND                           -->
  <!-- ═══════════════════════════════════════════ -->
  <rect width="520" height="160" rx="22" fill="url(#bgGrad)"/>

  <!-- Subtle glass border -->
  <rect width="520" height="160" rx="22" fill="none"
        stroke="rgba(79,142,247,0.18)" stroke-width="1"/>

  <!-- Top-edge highlight line (glass effect) -->
  <rect x="1" y="1" width="518" height="1" rx="1"
        fill="rgba(255,255,255,0.06)"/>

  <!-- ═══════════════════════════════════════════ -->
  <!--  ICON  (centered in 0–150 band, at 75,80)  -->
  <!-- ═══════════════════════════════════════════ -->

  <!-- Ambient glow behind icon -->
  <circle cx="75" cy="80" r="58" fill="url(#iconGlow)"/>

  <!--
    Pentagon node layout (r=40 from center 75,80):
    Node A (top):          75,  40
    Node B (top-right):   113,  55   (angle -18°)
    Node C (bottom-right): 99, 100   (angle  54°)
    Node D (bottom-left):  51, 100   (angle 126°)
    Node E (top-left):     37,  55   (angle 198°)
  -->

  <!-- ── Outer web (between adjacent nodes, very faint) ── -->
  <line x1="75"  y1="40"  x2="113" y2="55"  stroke="#4F8EF7" stroke-width="0.8" opacity="0.14"/>
  <line x1="113" y1="55"  x2="99"  y2="100" stroke="#7B5CF6" stroke-width="0.8" opacity="0.14"/>
  <line x1="99"  y1="100" x2="51"  y2="100" stroke="#7B5CF6" stroke-width="0.8" opacity="0.14"/>
  <line x1="51"  y1="100" x2="37"  y2="55"  stroke="#4F8EF7" stroke-width="0.8" opacity="0.14"/>
  <line x1="37"  y1="55"  x2="75"  y2="40"  stroke="#4F8EF7" stroke-width="0.8" opacity="0.14"/>

  <!-- ── Spokes from center to each outer node ── -->
  <line x1="75" y1="80" x2="75"  y2="40"  stroke="url(#aurora)" stroke-width="1.6" opacity="0.55"/>
  <line x1="75" y1="80" x2="113" y2="55"  stroke="url(#aurora)" stroke-width="1.6" opacity="0.55"/>
  <line x1="75" y1="80" x2="99"  y2="100" stroke="url(#aurora)" stroke-width="1.6" opacity="0.48"/>
  <line x1="75" y1="80" x2="51"  y2="100" stroke="url(#aurora)" stroke-width="1.6" opacity="0.48"/>
  <line x1="75" y1="80" x2="37"  y2="55"  stroke="url(#aurora)" stroke-width="1.6" opacity="0.55"/>

  <!-- ── Signal dots at spoke midpoints ── -->
  <circle cx="75"  cy="60"  r="2"   fill="#5B9BFF" opacity="0.95"/>
  <circle cx="94"  cy="67"  r="1.8" fill="#6E87F8" opacity="0.90"/>
  <circle cx="87"  cy="90"  r="1.6" fill="#7B5CF6" opacity="0.85"/>
  <circle cx="63"  cy="90"  r="1.6" fill="#7B5CF6" opacity="0.85"/>
  <circle cx="56"  cy="67"  r="1.8" fill="#5B9BFF" opacity="0.90"/>

  <!-- ── Outer satellite nodes ── -->

  <!-- Node A — top -->
  <circle cx="75"  cy="40"  r="7"   fill="#070D1D" stroke="#4F8EF7" stroke-width="1.8" filter="url(#glowSm)"/>
  <circle cx="75"  cy="40"  r="3.5" fill="#4F8EF7"/>

  <!-- Node B — top-right -->
  <circle cx="113" cy="55"  r="6.5" fill="#070D1D" stroke="#6080F8" stroke-width="1.8" filter="url(#glowSm)"/>
  <circle cx="113" cy="55"  r="3"   fill="#6080F8"/>

  <!-- Node C — bottom-right -->
  <circle cx="99"  cy="100" r="6"   fill="#070D1D" stroke="#7B5CF6" stroke-width="1.8" filter="url(#glowSm)"/>
  <circle cx="99"  cy="100" r="3"   fill="#7B5CF6"/>

  <!-- Node D — bottom-left -->
  <circle cx="51"  cy="100" r="6"   fill="#070D1D" stroke="#7B5CF6" stroke-width="1.8" filter="url(#glowSm)"/>
  <circle cx="51"  cy="100" r="3"   fill="#7B5CF6"/>

  <!-- Node E — top-left -->
  <circle cx="37"  cy="55"  r="6.5" fill="#070D1D" stroke="#4F8EF7" stroke-width="1.8" filter="url(#glowSm)"/>
  <circle cx="37"  cy="55"  r="3"   fill="#4F8EF7"/>

  <!-- ── Central hub node ── -->
  <!-- Outer ring with strong glow -->
  <circle cx="75" cy="80" r="16" fill="#070D1D" stroke="url(#aurora)" stroke-width="2.2" filter="url(#glowMd)"/>
  <!-- Filled core -->
  <circle cx="75" cy="80" r="9.5" fill="url(#aurora)"/>
  <!-- Bright specular highlight -->
  <circle cx="71" cy="76" r="3.2" fill="rgba(220,240,255,0.88)"/>

  <!-- ═══════════════════════════════════════════ -->
  <!--  SEPARATOR                                  -->
  <!-- ═══════════════════════════════════════════ -->
  <line x1="148" y1="30" x2="148" y2="130"
        stroke="rgba(79,142,247,0.18)" stroke-width="1"/>

  <!-- ═══════════════════════════════════════════ -->
  <!--  WORDMARK                                   -->
  <!-- ═══════════════════════════════════════════ -->

  <!-- Main name -->
  <text
    x="168" y="90"
    font-family="'SF Pro Display', 'Inter', 'Helvetica Neue', Arial, sans-serif"
    font-size="44"
    font-weight="700"
    letter-spacing="-1.8"
    fill="url(#auroraH)"
    filter="url(#glowTxt)"
  >Synapse</text>

  <!-- Tagline -->
  <text
    x="170" y="116"
    font-family="'SF Pro Text', 'Inter', 'Helvetica Neue', Arial, sans-serif"
    font-size="10.5"
    font-weight="400"
    letter-spacing="4"
    fill="#475569"
  >KNOWLEDGE OPERATING SYSTEM</text>

</svg>
